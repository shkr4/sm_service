<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Two Panel Form</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .form-wrapper {
      display: flex;
      gap: 2rem;
      background-color: white;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 1000px;
      width: 90%;
      flex-wrap: wrap;
    }

    .panel {
      flex: 1;
      min-width: 300px;
    }

    .panel h3 {
      margin-bottom: 1rem;
      color: #333;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #555;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 0.7rem;
      margin-bottom: 1.2rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      transition: border-color 0.3s ease;
      font-size: 1rem;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #667eea;
      outline: none;
    }

    .submit-btn {
      display: block;
      width: 100%;
      padding: 0.75rem;
      background-color: #667eea;
      border: none;
      color: white;
      font-weight: 600;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .submit-btn:hover {
      background-color: #5a67d8;
    }
  </style>
</head>
<body>
  <!-- <div class="d-flex justify-content-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div> -->
  <div>
    <form class="form-wrapper" id="dataForm">
      <div class="panel">
        <h3>Customer Information</h3>
        <label for="mobile">Customer Mobile No.: </label>
        <input type="text" id="mobile" name="mobile" required pattern="\d{10}" maxlength="10" />
    
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required />
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
        <label for="address">Address</label>
        <textarea id="address" name="address" rows="3"></textarea>
      </div>
      <div class="panel">
        <h3>Add Transaction Detail</h3>
        <label for="amount">Amount Deposited</label>
        <input type="number" id="amount" name="amount" placeholder="₹"/>
        <label for="comment">Comment</label>
        <textarea id="comment" name="comment" rows="3"></textarea>
      </div>
        
     
      <button type="submit" class="submit-btn">Submit
        <span id="spinner" style="display: none;" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      </button>
      
    </form>
  </div>
  <div>
    <div>
      <footer>
        <p><a href="/super-admin"><b>Access all the Database</b></a></p>
      </footer>
    </div>
  </div>
</body>
<script>
  // Handle mobile input event
  document.getElementById('mobile').addEventListener('input', function () {
    const mobile = this.value;
    if (mobile.length === 10 && /^\d{10}$/.test(mobile)) {
      fetch(`/check-mobile?number=${mobile}`)
        .then(response => {
          if (!response.ok) {
            document.getElementById('name').placeholder = "New Customer's Name";
            document.getElementById('email').placeholder = "New Customer's Email";
            document.getElementById('address').placeholder = "New Customer's Address";
            return null;
          }
          return response.json();
        })
        .then(data => {
          if (data) {
            console.log('Server response:', data);
            document.getElementById('name').value = data.name || '';
            document.getElementById('email').value = data.email || '';
            document.getElementById('address').value = data.address || '';
          }
        })
        .catch(error => {
          console.error('Error:', error);
        });
    } else {
      document.getElementById('name').placeholder = "";
      document.getElementById('email').placeholder = "";
      document.getElementById('address').placeholder = "";
      document.getElementById('name').value = "";
      document.getElementById('email').value = "";
      document.getElementById('address').value = "";
    }
  });

  // Handle form submission
  document.getElementById('dataForm').addEventListener('submit', function (event) {
    event.preventDefault(); // prevent default form submission
    customFunction();       // call custom async function
  });

  // Custom async submission function
  async function customFunction() {
    const spinner = document.getElementById('spinner');
    spinner.style.display = 'inline-block'; // Show spinner
    try {
      const response = await fetch('/submitData', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          mobile: document.getElementById('mobile').value,
          amount: document.getElementById('amount').value,
          comment: document.getElementById('comment').value,
          address: document.getElementById('address').value
        })
      });

      const data = await response.json();
      console.log(data);

      if (response.ok) {
        alert(data.msg);
      }
    } catch (error) {
      console.error("Error submitting feedback:", error);
    } finally {
      spinner.style.display = 'none'; // Hide spinner
    }
  }
</script>
</html>
